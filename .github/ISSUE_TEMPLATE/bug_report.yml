name: Bug report
description: Something in the contracts, tests or documentation behaves differently from what is documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues must not be reported here.** Follow [SECURITY.md](https://github.com/stepecosystem/step-eco-system/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Contracts
        - Tests / CI
        - Documentation
        - verify-onchain.js
    validations:
      required: true
  - type: input
    id: contract
    attributes:
      label: Contract and function (if applicable)
      placeholder: e.g. StepNFTFund.buyListed
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A failing test, a transaction hash on Polygon, or exact commands.
    validations:
      required: true
